{% extends 'items/base.html' %}

{% block static %}
{% load static %}
{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center bg-base-200 p-4">
    <div class="w-full max-w-md card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold text-center mb-4">Delete - {{ item.name }}</h2>
            
            {% if error %}
            <div class="alert alert-error mb-4">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <fieldset class="space-y-4">
                    <div>
                        <legend class="text-lg font-semibold mb-4">Are you sure you want to delete this item?</legend>
                    </div>
                    <div class="alert alert-warning mb-4">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>This action cannot be undone.</span>
                    </div>

                    <div class="form-control mt-6">
                        <button type="submit" class="btn bg-error text-white hover:bg-error-focus w-full">
                            Delete Item
                        </button>
                    </div>
                    <div class="form-control mt-4">
                        <a href="{% url 'item_personalized_overview_page' %}" class="btn btn-outline w-full">
                            Cancel
                        </a>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
{% endblock %}
