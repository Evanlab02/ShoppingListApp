{% extends "auth/base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
    <div class="w-full max-w-md card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold text-center mb-4">Shopping App Register</h2>
            {% if error %}
            <div class="alert alert-error mb-4">
                <p id="error-text">{{ error }}</p>
            </div>
            {% endif %}
            <form id="register-form" method="post" action="{% url 'register_action' %}">
                {% csrf_token %}
                <fieldset class="space-y-4">
                    <div>
                        <legend class="text-lg font-semibold mb-4">User Details</legend>
                    </div>
                    <div class="form-control w-full">
                        <label for="email" class="label">
                            <span class="label-text">Email:</span>
                        </label>
                        <input class="input input-bordered w-full" type="email" name="email" id="email" required>
                    </div>
                    <div class="form-control w-full">
                        <label for="password" class="label">
                            <span class="label-text">Password:</span>
                        </label>
                        <input class="input input-bordered w-full" type="password" name="password" id="password" required>
                    </div>
                    <div class="form-control w-full">
                        <label for="password_confirm" class="label">
                            <span class="label-text">Confirm Password:</span>
                        </label>
                        <input class="input input-bordered w-full" type="password" name="password_confirm" id="password_confirm" required>
                    </div>
                    
                    <div class="form-control w-full">
                        <label for="first_name" class="label">
                            <span class="label-text">First Name:</span>
                        </label>
                        <input class="input input-bordered w-full" type="text" name="first_name" id="first_name" required>
                    </div>
                    <div class="form-control w-full">
                        <label for="last_name" class="label">
                            <span class="label-text">Last Name:</span>
                        </label>
                        <input class="input input-bordered w-full" type="text" name="last_name" id="last_name" required>
                    </div>
                    <div class="form-control mt-6">
                        <input class="btn btn-primary w-full" type="submit" value="Create Account" id="submit">
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
{% endblock %}
