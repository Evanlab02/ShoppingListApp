{% extends "auth/base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
    <div class="w-full max-w-md card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold text-center mb-4">Shopping App Login</h2>
            {% if error %}
            <div class="alert alert-error mb-4">
                <p id="error-text">{{ error }}</p>
            </div>
            {% endif %}
            <form method="post" action="{% url 'login_action' %}">
                {% csrf_token %}
                <fieldset class="space-y-4">
                    <div>
                        <legend class="text-lg font-semibold mb-4">Login Details</legend>
                    </div>
                    <div class="form-control w-full">
                        <label for="username" class="label">
                            <span class="label-text">Username:</span>
                        </label>
                        <input class="input input-bordered w-full" type="text" name="username" id="username">
                    </div>
                    <div class="form-control w-full">
                        <label for="password" class="label">
                            <span class="label-text">Password:</span>
                        </label>
                        <input class="input input-bordered w-full" type="password" name="password" id="password">
                    </div>
                    <div class="form-control mt-6">
                        <input type="submit" value="Login" id="submit" class="btn btn-primary w-full">
                    </div>
                    <div class="text-center mt-4">
                        <a href="{% url 'register_page' %}" class="link link-primary">
                            Register
                        </a>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
{% endblock %}
