site_name: Shopping List App
site_url: https://evanlab02.github.io/ShoppingListApp/
repo_url: https://github.com/evanlab02/ShoppingListApp
repo_name: ShoppingListApp

extra:
  version:
    provider: mike

plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - "pymdownx.inlinehilite"
  - "pymdownx.snippets"
  - "pymdownx.superfences"
  - "admonition"
  - "pymdownx.details"
  - "pymdownx.superfences"
theme:
  name: material
  features:
    - content.code.copy
  palette: 
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Home: index.md
  - Getting Started: start.md
  - API:
    - Getting Started: api/index.md
    - Error Handling: api/errors.md
