name: shopping-dev

services:
  pgadmin:
    container_name: shopping-pgadmin
    image: dpage/pgadmin4:9.4.0
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      SCRIPT_NAME: /pgadmin
    networks:
      - shopping-network-dev
    volumes:
      - shopping-pgadmin-data-dev:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  db:
    container_name: shopping-db
    image: postgres:17.5-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
    env_file:
      - .env.dev
    networks:
      - shopping-network-dev
    volumes:
      - shopping-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  redis:
    image: redis:8.0.2-alpine3.21
    container_name: shopping-redis
    volumes:
      - shopping-redis-data-dev:/data
    networks:
      - shopping-network-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  admin:
    container_name: shopping-admin
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    env_file:
      - .env.dev
    networks:
      - shopping-network-dev
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  app:
    container_name: shopping-app
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        - WORKERS=8
    env_file:
      - .env.dev
    networks:
      - shopping-network-dev
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend/authentication
          target: /backend/authentication
        - action: sync+restart
          path: ./backend/stores
          target: /backend/stores
        - action: sync+restart
          path: ./backend/items
          target: /backend/items
        - action: sync+restart
          path: ./backend/shoppingapp
          target: /backend/shoppingapp
        - action: sync+restart
          path: ./backend/dashboard
          target: /backend/dashboard
        - action: rebuild
          path: ./backend/requirements.txt
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8192M

  web:
    container_name: shopping-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    expose:
      - "80"
    ports:
      - "8001:80"
    networks:
      - shopping-network-dev
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./web/Caddyfile
          target: /etc/caddy/Caddyfile
        - action: sync+restart
          path: ./backend/static
          target: /var/www/html/static/
        - action: rebuild
          path: ./docs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

networks:
  shopping-network-dev:
    driver: bridge

volumes:
  shopping-db-data-dev:
    external: false
  shopping-pgadmin-data-dev:
    external: false
  shopping-redis-data-dev:
    external: false
