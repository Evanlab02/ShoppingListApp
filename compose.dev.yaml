services:
  dev-shopping-app-pgadmin:
    container_name: shopping-pgadmin
    image: dpage/pgadmin4:8.5
    env_file:
      - .env.dev
    environment:
      SCRIPT_NAME: /pgadmin
    networks:
      - dev-postgres-django-network
    restart: always
    volumes:
      - dev-pgadmin-data:/var/lib/pgadmin

  dev-shopping-app-db:
    container_name: shopping-db
    image: postgres:16.2-alpine3.18
    environment:
      POSTGRES_USER: postgres
    env_file:
      - .env.dev
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-postgres-django-network
    restart: always

  dev-shopping-django-administration:
    container_name: shopping-django-admin
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    env_file:
      - .env.dev
    environment:
      SHOPPING_DEFAULT_SETTINGS_MODULE: shoppingapp.settings.settings
    command: /bin/bash -c "python manage.py migrate && python manage.py runserver"
    depends_on:
      dev-shopping-app-db:
        condition: service_healthy
    networks:
      - dev-postgres-django-network

  dev-shopping-django-app:
    container_name: shopping-django-app
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    environment:
      SHOPPING_DEFAULT_SETTINGS_MODULE: shoppingapp.settings.settings
      TESTS_ENVIRONMENT: true
    env_file:
      - .env.dev
    command: "uvicorn shoppingapp.config.asgi:app --host 0.0.0.0 --port 80 --workers 16"
    depends_on:
      dev-shopping-app-db:
        condition: service_healthy
    networks:
      - dev-postgres-django-network
    restart: always
    develop:
      watch:
        - action: sync+restart
          path: ../src/authentication
          target: /src/authentication
        - action: sync+restart
          path: ../src/stores
          target: /src/stores
        - action: sync+restart
          path: ../src/items
          target: /src/items
        - action: sync+restart
          path: ../src/shoppingapp
          target: /src/shoppingapp
        - action: rebuild
          path: ../src/requirements.txt

  dev-shopping-django-site:
    container_name: shopping-django-site
    build:
      context: .
      dockerfile: docker/site/Dockerfile
    expose:
      - "80"
    ports:
      - "8001:80"
    depends_on:
      dev-shopping-app-db:
        condition: service_healthy
    networks:
      - dev-postgres-django-network
    restart: always
    develop:
      watch:
        - action: sync+restart
          path: ../src/Caddyfile
          target: /etc/caddy/Caddyfile
        - action: sync+restart
          path: ../src/static
          target: /var/www/html/static/
        - action: sync+restart
          path: ../src/htmlcov
          target: /var/www/html/htmlcov/

  dev-shopping-load-testing:
    container_name: shopping-load-testing
    build:
      context: .
      dockerfile: docker/testing/Dockerfile
    expose:
      - "8089"
    ports:
      - "8089:8089"
    networks:
      - dev-postgres-django-network
    restart: always

networks:
  dev-postgres-django-network:
    driver: bridge

volumes:
  dev-postgres-data:
    external: false
  dev-pgadmin-data:
    external: false
