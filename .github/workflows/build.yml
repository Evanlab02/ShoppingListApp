name: Build

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  static-files-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Load .env file
        uses: aarcangeli/load-dotenv@v1.0.0
        with:
          path: ""
          filenames: |
            .env.template
          quiet: false
          if-file-not-found: error

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt

      - name: Create/Build Static Files
        run: |
          python manage.py collectstatic --no-input

  docker-images-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Images
        run: |
          docker build -f docker/admin/Dockerfile -t shopping-app-admin .
          docker build -f docker/benchmark/Dockerfile -t shopping-app-benchmark .
          docker build -f docker/frontend/dev/Dockerfile -t shopping-app-frontend-dev .
          docker build -f docker/server/Dockerfile -t shopping-app-server .
          docker build -f docker/web/Dockerfile -t shopping-app-web .
